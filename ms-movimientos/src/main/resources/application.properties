spring.application.name=ms-movimientos
server.port=8082

# Dirección del microservicio de productos
productos.url=http://localhost:8081/api/productos

# Base de datos H2 propia de este microservicio
# WRITE_DELAY=0: guarda cada cambio en el archivo al instante (no se pierde nada si se cierra de golpe)
spring.datasource.url=jdbc:h2:file:./data/movimientos-db;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola: http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
