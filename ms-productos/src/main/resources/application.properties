spring.application.name=ms-productos
server.port=8081

# Base de datos H2 guardada en archivo (carpeta data/), así los datos no se pierden al reiniciar
# WRITE_DELAY=0: guarda cada cambio en el archivo al instante (no se pierde nada si se cierra de golpe)
spring.datasource.url=jdbc:h2:file:./data/productos-db;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web para ver y modificar la base de datos: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
