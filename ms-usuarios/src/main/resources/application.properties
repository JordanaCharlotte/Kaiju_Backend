spring.application.name=ms-usuarios
server.port=8083

# Base de datos H2 propia de este microservicio
# WRITE_DELAY=0: guarda cada cambio en el archivo al instante (no se pierde nada si se cierra de golpe)
spring.datasource.url=jdbc:h2:file:./data/usuarios-db;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola: http://localhost:8083/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
